name: Deploy to AWS EC2

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Grant execute permission for gradlew
        run: chmod +x complete/gradlew

      # 1. 여기서(GitHub 컴퓨터) 빌드를 다 끝냅니다.
      - name: Build with Gradle
        run: |
          cd complete
          ./gradlew clean build -x test

      # 2. [추가됨] 빌드된 결과물(JAR 파일)만 서버로 "배달"합니다.
      - name: Copy JAR to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          port: 22
          # GitHub에서 만든 jar 파일을
          source: "complete/build/libs/*.jar"
          # 서버의 이 폴더로 복사합니다
          target: "/home/ubuntu/gs-spring-boot"
          # (옵션) 불필요한 경로 제거
          strip_components: 0

      # 3. 서버는 이제 "요리(빌드)"를 안 하고 "서빙(실행)"만 합니다.
      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          port: 22
          script: |
            # 기존에 돌던 서버 끄기
            sudo pkill -f 'java -jar' || true

            # 업로드된 폴더로 이동 (scp로 전송된 위치)
            cd /home/ubuntu/gs-spring-boot/complete/build/libs

            # 실행 로그 폴더 생성
            mkdir -p logs

            # 실행! (빌드 과정 없이 바로 실행하므로 1초면 됩니다)
            # jar 파일 이름은 상황에 맞게 자동으로 잡히도록 * 사용
            nohup java -jar *SNAPSHOT.jar > logs/nohup.out 2>&1 &
