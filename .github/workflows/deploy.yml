name: Deploy to AWS EC2

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Grant execute permission for gradlew
        run: chmod +x complete/gradlew

      # 1. GitHub에서 빌드 (서버 아님)
      - name: Build with Gradle
        run: |
          cd complete
          ./gradlew clean build -x test

      # 2. 결과물(JAR) 서버로 배달
      - name: Copy JAR to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          port: 22
          source: "complete/build/libs/*.jar"
          target: "/home/ubuntu/gs-spring-boot"
          strip_components: 0

      # 3. 서버에서 실행 (메모리 제한 추가됨!)
      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          port: 22
          timeout: 40m
          command_timeout: 40m
          script: |
            # 1. 기존 서버 즉시 종료
            sudo pkill -9 -f 'java -jar' || true

            # 2. [중요] 파일 전송으로 쌓인 캐시 메모리 강제 삭제 (청소)
            # 이걸 해야 Java가 들어갈 자리가 생깁니다.
            echo 3 | sudo tee /proc/sys/vm/drop_caches

            # 3. 경로 이동
            cd /home/ubuntu/gs-spring-boot/complete/build/libs
            mkdir -p logs

            # 4. [수정됨] 메모리 256MB로 더 줄임 (t3.micro 최적화)
            # -Xms128m : 시작할 때 128MB만 씀
            # -Xmx256m : 최대 256MB까지만 씀
            nohup java -Xms128m -Xmx256m -jar *SNAPSHOT.jar > logs/nohup.out 2>&1 &

            # 5. 안전하게 대기 후 종료
            sleep 2
            exit 0
