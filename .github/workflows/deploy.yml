name: Deploy to AWS EC2

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Grant execute permission for gradlew
        run: chmod +x complete/gradlew

      # 1. GitHub에서 빌드 (서버 아님)
      - name: Build with Gradle
        run: |
          cd complete
          ./gradlew clean build -x test

      # 2. 결과물(JAR) 서버로 배달
      - name: Copy JAR to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          port: 22
          source: "complete/build/libs/*.jar"
          target: "/home/ubuntu/gs-spring-boot"
          strip_components: 0

      # 3. 서버에서 실행 (메모리 제한 추가됨!)
      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          port: 22
          timeout: 40m
          command_timeout: 40m
          script: |
            # 1. 기존 서버 끄기 (강제 종료 옵션 -9 추가)
            # 좀비 프로세스까지 확실하게 죽입니다.
            sudo pkill -9 -f 'java -jar' || true

            # 2. 경로 이동
            cd /home/ubuntu/gs-spring-boot/complete/build/libs
            mkdir -p logs

            # 3. 실행 (메모리 제한 512MB)
            # nohup 실행 후 2초 쉬었다가(sleep 2) 확실하게 퇴장(exit)합니다.
            nohup java -Xmx384m -jar *SNAPSHOT.jar > logs/nohup.out 2>&1 &
            sleep 2
            exit 0
