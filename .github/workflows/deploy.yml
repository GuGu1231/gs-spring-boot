name: Deploy to AWS EC2

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH로 서버 접속해서 배포 스크립트 실행
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          port: 22
          timeout: 40m # 중요! 타임아웃을 40분으로 늘림 (기본 10분은 너무 짧음)
          command_timeout: 40m # 명령어 실행 제한 시간도 늘림
          script: |
            # 1. 프로젝트 폴더로 이동
            cd gs-spring-boot/complete

            # 2. 최신 코드 가져오기
            git pull origin main

            # 3. 기존 서버 멈추기
            sudo pkill -f 'java -jar' || true

            # 4. 빌드하기 (메모리 부족 방지 옵션 추가!)
            chmod +x gradlew
            ./gradlew clean build -x test -Dorg.gradle.jvmargs="-Xmx512m"

            # 5. 새 서버 실행 (로그 남기기 강화)
            mkdir -p logs
            nohup java -jar build/libs/*SNAPSHOT.jar > logs/nohup.out 2>&1 &
