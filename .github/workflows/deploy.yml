name: Deploy to AWS EC2

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      # 1. Gradle 실행 권한 부여
      - name: Grant execute permission for gradlew
        run: chmod +x gs-spring-boot/complete/gradlew

      # 2. 빌드 (테스트 제외 -x test 옵션 필수!)
      - name: Build with Gradle
        run: |
          cd gs-spring-boot/complete
          ./gradlew clean build -x test

      # 3. AWS 서버로 배포
      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          port: 22
          timeout: 40m
          command_timeout: 40m
          script: |
            cd gs-spring-boot/complete
            git pull origin main
            sudo pkill -f 'java -jar' || true
            chmod +x gradlew
            ./gradlew clean build -x test
            mkdir -p logs
            nohup java -jar build/libs/*SNAPSHOT.jar > logs/nohup.out 2>&1 &
