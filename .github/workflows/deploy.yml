name: Deploy to AWS EC2

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Grant execute permission for gradlew
        run: chmod +x complete/gradlew

      # 1. GitHub에서 빌드 (서버 아님)
      - name: Build with Gradle
        run: |
          cd complete
          ./gradlew clean build -x test

      # 2. 결과물(JAR) 서버로 배달
      - name: Copy JAR to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          port: 22
          source: "complete/build/libs/*.jar"
          target: "/home/ubuntu/gs-spring-boot"
          strip_components: 0

      # 3. 서버에서 실행 (메모리 제한 추가됨!)
      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          port: 22
          timeout: 40m
          command_timeout: 40m
          script: |
            sudo pkill -f 'java -jar' || true
            cd /home/ubuntu/gs-spring-boot/complete/build/libs
            mkdir -p logs

            # [중요] -Xmx512m 옵션 추가됨
            nohup java -Xmx512m -jar *SNAPSHOT.jar > logs/nohup.out 2>&1 &
