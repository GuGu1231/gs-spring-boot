name: Deploy to AWS EC2

on:
  push:
    branches: ["main"] # main 브랜치에 코드가 올라오면 실행

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH로 서버 접속해서 배포 스크립트 실행
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }} # 아까 등록한 IP
          username: ${{ secrets.USERNAME }} # 아까 등록한 ubuntu
          key: ${{ secrets.KEY }} # 아까 등록한 pem 키
          script: |
            # 1. 프로젝트 폴더로 이동 (폴더명 확인 필요!)
            cd gs-spring-boot/complete

            # 2. 최신 코드 가져오기
            git pull origin main

            # 3. 기존 서버 멈추기 (실행 중인 java가 없으면 에러 나지 않게 처리)
            sudo pkill -f 'java -jar' || true

            # 4. 빌드하기 (권한 부여 후 빌드)
            chmod +x gradlew
            ./gradlew clean build -x test

            # 5. 새 서버 실행 (nohup으로 백그라운드 실행)
            # logs 폴더가 없다면 생성
            mkdir -p logs
            nohup java -jar build/libs/*SNAPSHOT.jar > logs/nohup.out 2>&1 &
